name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Path to your .csproj or .sln, from the repository root
  PROJECT: DemoImagesApi/DemoImagesApi.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "${{ env.PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT }}" --configuration Release --no-restore
